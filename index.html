<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Weekend Vibes</h1>

        <!-- Google Form Action URL will be handled by JS for custom redirect -->
        <form id="weekendForm">

            <!-- Question 1 -->
            <div class="form-group">
                <label>Options for this weekend?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="entry.1000819200" value="Continue Culinary Class Wars / JJBA" required
                            data-script-id="q1-option-1-input">
                        <div class="radio-tile">
                            <span class="radio-label" data-script-id="q1-option-1-label">Continue Culinary Class Wars / JJBA</span>
                        </div>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="entry.1000819200" value="Browse at Michael's for crochet stuff"
                            data-script-id="q1-option-2-input">
                        <div class="radio-tile">
                            <span class="radio-label" data-script-id="q1-option-2-label">Browse at Michael's for crochet stuff</span>
                        </div>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="entry.1000819200" value="Morning walk + Study session"
                            data-script-id="q1-option-3-input">
                        <div class="radio-tile">
                            <span class="radio-label" data-script-id="q1-option-3-label">Morning walk + Study session</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="form-group">
                <label>Energy levels after this week?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="entry.1845770731" value="High" required>
                        <div class="radio-tile">
                            <span class="radio-label">🔋 High</span>
                        </div>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="entry.1845770731" value="Low">
                        <div class="radio-tile">
                            <span class="radio-label">🪫 Low</span>
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <span>Submit Response</span>
                <div class="loader" id="submitLoader"
                    style="width: 20px; height: 20px; border-width: 2px; vertical-align: middle; margin-left: 10px;">
                </div>
            </button>

        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
